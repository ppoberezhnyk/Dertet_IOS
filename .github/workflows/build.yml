name: Build macOS DMG

on:
  workflow_dispatch:
  push:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Build Native macOS App
        run: |
          PROJ_PATH=$(find . -name "ResertAI.xcodeproj" | head -n 1)
          if [ -z "$PROJ_PATH" ]; then
            echo "Error: ResertAI.xcodeproj not found!"
            exit 1
          fi

          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "ResertAI" \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package DMG
        run: |
          APP_PATH=$(find ./build/Build/Products/Release -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app binary not found!"
            exit 1
          fi
          
          mkdir -p dmg_folder
          cp -R "$APP_PATH" dmg_folder/
          ln -s /Applications dmg_folder/Applications
          
          hdiutil create -volname "ResertAI" -srcfolder dmg_folder -ov -format UDZO ResertAI.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResertAI-macOS-DMG
          path: ResertAI.dmg
