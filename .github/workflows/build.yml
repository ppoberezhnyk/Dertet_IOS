name: Build macOS DMG & iOS IPA

on:
  workflow_dispatch:
  push:

jobs:
  build-mac:
    name: Build macOS DMG (Intel x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Clean Syntax & Missing Assets
        run: |
          find . -name "*.swift" -exec sed -i '' 's/\.toolbar(\.hidden, *for: *\.navigationBar)//g' {} +
          find . -name "*.swift" -exec sed -i '' 's/\.toolbarBackground([^)]*)//g' {} +
          find . -name "*.swift" -exec sed -i '' 's/\.navigationBarTitleDisplayMode([^)]*)//g' {} +
          
          find . -type d -name "Preview Content" | while read -r dir; do
            mkdir -p "$dir/Preview Assets.xcassets"
            echo '{"info":{"author":"xcode","version":1}}' > "$dir/Preview Assets.xcassets/Contents.json"
          done

      - name: Build macOS App via Xcode
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          
          cd "$PROJ_DIR"
          
          xcodebuild build \
            -project "$(basename "$PROJ_PATH")" \
            -scheme "ResertAI" \
            -destination "generic/platform=macOS,arch=x86_64" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_ASSET_PATHS="" \
            ENABLE_PREVIEWS=NO \
            BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Package macOS DMG
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          mkdir -p dmg_folder
          cp -R "$APP_PATH" dmg_folder/
          ln -s /Applications dmg_folder/Applications
          hdiutil create -volname "ResertAI" -srcfolder dmg_folder -ov -format UDZO ResertAI.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: ResertAI-macOS-Intel-DMG
          path: ResertAI.dmg

  build-ios:
    name: Build iOS Fullscreen IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Clean Missing Assets
        run: |
          find . -type d -name "Preview Content" | while read -r dir; do
            mkdir -p "$dir/Preview Assets.xcassets"
            echo '{"info":{"author":"xcode","version":1}}' > "$dir/Preview Assets.xcassets/Contents.json"
          done

      - name: Build iOS App via Xcode
        run: |
          PROJ_PATH=$(find . -name "*.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          
          cd "$PROJ_DIR"
          
          xcodebuild build \
            -project "$(basename "$PROJ_PATH")" \
            -scheme "ResertAI" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_ASSET_PATHS="" \
            ENABLE_PREVIEWS=NO \
            BUILD_DIR="$GITHUB_WORKSPACE/build"

      - name: Package iOS IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ResertAI.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ResertAI-iOS-Fullscreen-IPA
          path: ResertAI.ipa
