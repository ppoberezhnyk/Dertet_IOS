- name: Build macOS App via Xcodebuild
run: |
PROJ_PATH=(find . -name "*.xcodeproj" | head -n 1)
SCHEME_NAME=(xcodebuild -list -project "$PROJ_PATH" | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
xcodebuild build 
-project "$PROJ_PATH" 
-scheme "$SCHEME_NAME" 
-sdk macosx 
-destination 'generic/platform=macOS,arch=x86_64' 
-configuration Release 
CODE_SIGN_IDENTITY="" 
CODE_SIGNING_REQUIRED=NO 
CODE_SIGNING_ALLOWED=NO 
BUILD_DIR=build
- name: Package macOS DMG
run: |
APP_PATH=$(find build/Release -name "*.app" | head -n 1)
mkdir -p dmg_folder
cp -R "$APP_PATH" dmg_folder/
ln -s /Applications dmg_folder/Applications
hdiutil create -volname "Dertet" -srcfolder dmg_folder -ov -format UDZO Dertet.dmg
- name: Upload macOS DMG Artifact
uses: actions/upload-artifact@v4
with:
name: Dertet-macOS-Intel-DMG
path: Dertet.dmg
build-ios:
name: Build iOS Fullscreen IPA
runs-on: macos-14
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Unzip Source Code
run: |
find . -maxdepth 1 -name "*.zip" -exec unzip -o {} ;
- name: Recreate Missing Preview Assets
run: |
PREVIEW_DIR=$(find . -name "Preview Content" -type d | head -n 1)
if [ -z "$PREVIEW_DIR" ]; then
PREVIEW_DIR="ResertAI/Preview Content"
fi
mkdir -p "$PREVIEW_DIR/Preview Assets.xcassets"
echo '{"info":{"author":"xcode","version":1}}' > "$PREVIEW_DIR/Preview Assets.xcassets/Contents.json"
- name: Build iOS App via Xcodebuild
run: |
PROJ_PATH=(find . -name "*.xcodeproj" | head -n 1)
SCHEME_NAME=(xcodebuild -list -project "$PROJ_PATH" | grep -A 10 "Schemes:" | tail -n +2 | head -n 1 | xargs)
xcodebuild build 
-project "$PROJ_PATH" 
-scheme "$SCHEME_NAME" 
-sdk iphoneos 
-destination 'generic/platform=iOS' 
-configuration Release 
CODE_SIGN_IDENTITY="" 
CODE_SIGNING_REQUIRED=NO 
CODE_SIGNING_ALLOWED=NO 
BUILD_DIR=build
- name: Create Fullscreen iOS Info.plist & Package IPA
run: |
APP_PATH=$(find build/Release-iphoneos -name "*.app" | head -n 1)
plutil -insert UILaunchScreen -xml "<dict/>" "$APP_PATH/Info.plist" || true
mkdir -p Payload
cp -R "$APP_PATH" Payload/
zip -r Dertet.ipa Payload
- name: Upload iOS IPA Artifact
uses: actions/upload-artifact@v4
with:
name: Dertet-iOS-Fullscreen-IPA
path: Dertet.ipa
