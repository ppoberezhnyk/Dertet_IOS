name: Build macOS DMG

on:
  workflow_dispatch:
  push:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Patch Xcode Project for macOS
        run: |
          PBXPROJ=$(find . -name "project.pbxproj" | head -n 1)
          if [ -f "$PBXPROJ" ]; then
            sed -i '' 's/SDKROOT = iphoneos;/SDKROOT = macosx;/g' "$PBXPROJ"
            sed -i '' 's/SDKROOT = iphonesimulator;/SDKROOT = macosx;/g' "$PBXPROJ"
            sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = "7";/g' "$PBXPROJ"
            sed -i '' 's/SUPPORTED_PLATFORMS = "iphoneos iphonesimulator";/SUPPORTED_PLATFORMS = "macosx iphoneos iphonesimulator";/g' "$PBXPROJ"
            sed -i '' 's/SUPPORTS_MACCATALYST = NO;/SUPPORTS_MACCATALYST = YES;/g' "$PBXPROJ"
          fi

      - name: Build macOS App
        run: |
          PROJ_PATH=$(find . -name "ResertAI.xcodeproj" | head -n 1)
          
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "ResertAI" \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package DMG
        run: |
          APP_PATH=$(find ./build/Build/Products/Release -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app binary not found!"
            exit 1
          fi
          
          mkdir -p dmg_folder
          cp -R "$APP_PATH" dmg_folder/
          ln -s /Applications dmg_folder/Applications
          
          hdiutil create -volname "ResertAI" -srcfolder dmg_folder -ov -format UDZO ResertAI.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResertAI-macOS-DMG
          path: ResertAI.dmg
