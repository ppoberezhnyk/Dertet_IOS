name: Build macOS DMG

on:
  workflow_dispatch:
  push:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Inject macOS Target Settings
        run: |
          PBXPROJ=$(find . -name "project.pbxproj" | head -n 1)
          if [ -f "$PBXPROJ" ]; then
            python3 -c '
import sys, re

path = sys.argv[1]
with open(path, "r") as f:
    content = f.read()

# Force SDK and supported platforms to macOS
content = re.sub(r"SDKROOT = [^;]+;", "SDKROOT = macosx;", content)
content = re.sub(r"SUPPORTED_PLATFORMS = [^;]+;", "SUPPORTED_PLATFORMS = \"macosx iphoneos iphonesimulator\";", content)
content = re.sub(r"TARGETED_DEVICE_FAMILY = [^;]+;", "TARGETED_DEVICE_FAMILY = \"7\";", content)

# Enable Mac Catalyst / macOS destination
if "SUPPORTS_MACCATALYST" in content:
    content = re.sub(r"SUPPORTS_MACCATALYST = [^;]+;", "SUPPORTS_MACCATALYST = YES;", content)
else:
    content = content.replace("buildSettings = {", "buildSettings = {\n\t\t\t\tSUPPORTS_MACCATALYST = YES;")

with open(path, "w") as f:
    f.write(content)
' "$PBXPROJ"
          fi

      - name: Build macOS App
        run: |
          PROJ_PATH=$(find . -name "ResertAI.xcodeproj" | head -n 1)
          
          xcodebuild build \
            -project "$PROJ_PATH" \
            -scheme "ResertAI" \
            -configuration Release \
            -sdk macosx \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./build

          mkdir -p ./build/Export
          APP_DIR=$(find ./build/Build/Products/Release* -name "*.app" | head -n 1)
          cp -R "$APP_DIR" ./build/Export/ResertAI.app

      - name: Package DMG
        run: |
          mkdir -p dmg_folder
          cp -R ./build/Export/ResertAI.app dmg_folder/
          ln -s /Applications dmg_folder/Applications
          
          hdiutil create -volname "ResertAI" -srcfolder dmg_folder -ov -format UDZO ResertAI.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResertAI-macOS-DMG
          path: ResertAI.dmg
