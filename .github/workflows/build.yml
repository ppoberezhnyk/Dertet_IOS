name: Build iOS IPA

on:
  workflow_dispatch:
  push:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          mkdir -p extracted
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} -d extracted/ \;

      - name: Build iOS Project
        run: |
          PROJ_PATH=$(find extracted -name "*.xcodeproj" | head -n 1)
          PROJ_DIR=$(dirname "$PROJ_PATH")
          
          cd "$PROJ_DIR"
          
          xcodebuild build \
            -project "$(basename "$PROJ_PATH")" \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ASSETCATALOG_COMPILER_SKIP_APP_STORE_DEPLOYMENT=YES \
            BUILD_DIR="$GITHUB_WORKSPACE/build_ios"

      - name: Package iOS IPA
        run: |
          APP_PATH=$(find build_ios -name "*.app" -type d | head -n 1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ResertAI.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: ResertAI-iOS-IPA
          path: ResertAI.ipa
