name: Build macOS DMG

on:
  workflow_dispatch:
  push:

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          mkdir -p source_code
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} -d source_code \;

      - name: Create App Structure
        run: |
          mkdir -p ResertAI.app/Contents/MacOS
          mkdir -p ResertAI.app/Contents/Resources

      - name: Compile Swift Source Files
        run: |
          SWIFT_FILES=$(find source_code -name "*.swift")
          if [ -z "$SWIFT_FILES" ]; then
            SWIFT_FILES=$(find . -maxdepth 3 -name "*.swift")
          fi
          
          xcrun -sdk macosx swiftc $SWIFT_FILES \
            -target x86_64-apple-macos11.0 \
            -emit-executable \
            -o ResertAI.app/Contents/MacOS/ResertAI || \
          xcrun -sdk macosx swiftc $SWIFT_FILES \
            -emit-executable \
            -o ResertAI.app/Contents/MacOS/ResertAI

      - name: Create Info.plist
        run: |
          cat <<EOF > ResertAI.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>ResertAI</string>
              <key>CFBundleIdentifier</key>
              <string>com.resert.ai</string>
              <key>CFBundleName</key>
              <string>ResertAI</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
          </dict>
          </plist>
          EOF

      - name: Package DMG
        run: |
          mkdir -p dmg_folder
          cp -R ResertAI.app dmg_folder/
          ln -s /Applications dmg_folder/Applications
          
          hdiutil create -volname "ResertAI" -srcfolder dmg_folder -ov -format UDZO ResertAI.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ResertAI-macOS-DMG
          path: ResertAI.dmg
