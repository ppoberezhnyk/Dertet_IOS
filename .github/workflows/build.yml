name: Build macOS DMG & iOS IPA

on:
  workflow_dispatch:
  push:

jobs:
  build-mac:
    name: Build macOS DMG (Intel x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Clean Syntax & Prepare Code
        run: |
          # Прибираємо несумісні модифікатори UI для macOS
          find . -name "*.swift" -exec sed -i '' 's/\.toolbar(\.hidden, *for: *\.navigationBar)//g' {} +
          find . -name "*.swift" -exec sed -i '' 's/\.toolbarBackground([^)]*)//g' {} +
          find . -name "*.swift" -exec sed -i '' 's/\.navigationBarTitleDisplayMode([^)]*)//g' {} +

      - name: Compile macOS Binary via Swift Compiler
        run: |
          mkdir -p Dertet.app/Contents/MacOS
          mkdir -p Dertet.app/Contents/Resources
          
          # Збираємо всі swift файли, виключаючи Preview Content
          SWIFT_FILES=$(find . -name "*.swift" ! -path "*/Preview Content/*" | sort -u)
          
          xcrun -sdk macosx swiftc $SWIFT_FILES \
            -parse-as-library \
            -framework SwiftUI \
            -framework AppKit \
            -target x86_64-apple-macos14.0 \
            -o Dertet.app/Contents/MacOS/Dertet

      - name: Create Native macOS Info.plist
        run: |
          cat <<EOF > Dertet.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Dertet</string>
              <key>CFBundleIdentifier</key>
              <string>com.dertet.app</string>
              <key>CFBundleName</key>
              <string>Dertet</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          EOF

      - name: Package macOS DMG
        run: |
          mkdir -p dmg_folder
          cp -R Dertet.app dmg_folder/
          ln -s /Applications dmg_folder/Applications
          
          hdiutil create -volname "Dertet" -srcfolder dmg_folder -ov -format UDZO Dertet.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dertet-macOS-Intel-DMG
          path: Dertet.dmg

  build-ios:
    name: Build iOS Fullscreen IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip -o {} \;

      - name: Compile iOS Binary via Swift Compiler
        run: |
          mkdir -p Payload/Dertet.app
          
          # Отримуємо всі вихідні файли продукту
          SWIFT_FILES=$(find . -name "*.swift" ! -path "*/Preview Content/*" | sort -u)
          
          xcrun -sdk iphoneos swiftc -suppress-warnings $SWIFT_FILES \
            -parse-as-library \
            -framework SwiftUI \
            -framework UIKit \
            -target arm64-apple-ios17.0 \
            -o Payload/Dertet.app/Dertet

      - name: Create Fullscreen iOS Info.plist
        run: |
          cat <<EOF > Payload/Dertet.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.plist">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Dertet</string>
              <key>CFBundleIdentifier</key>
              <string>com.dertet.app</string>
              <key>CFBundleName</key>
              <string>Dertet</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>17.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          EOF

      - name: Package iOS IPA
        run: |
          zip -r Dertet.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dertet-iOS-Fullscreen-IPA
          path: Dertet.ipa
